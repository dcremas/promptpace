# nginx site for PromptPace (Amazon Linux 2023 layout). This is the live file on the box.
# Install: sudo cp deploy/nginx.conf /etc/nginx/conf.d/promptpace.conf
#          sudo nginx -t && sudo systemctl reload nginx
# The certificate came from `certbot --nginx -d typing.dustincremascoli.com` and renews via
# certbot-renew.timer. On a fresh box, get it first (certbot needs the port-80 block only).

# Goes in the http {} context (conf.d files are included there).
limit_req_zone $binary_remote_addr zone=promptpace_api:10m rate=10r/s;

upstream promptpace {
    server unix:/run/promptpace/uvicorn.sock;
    keepalive 16;
}

# Plain HTTP: certificate challenges, and a redirect for everything else.
server {
    listen 80;
    listen [::]:80;
    server_name typing.dustincremascoli.com;

    # Let's Encrypt HTTP-01 challenges, from the webroot every site on this box shares.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name typing.dustincremascoli.com;

    ssl_certificate /etc/letsencrypt/live/typing.dustincremascoli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typing.dustincremascoli.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Keystroke logs are small; 2 MB is generous.
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # The weblog beacon. The box's 00-weblog.conf injects <script src="/__wl/w.js"> into
    # every HTML page; this include serves that script and its same-origin /__wl/ endpoint,
    # as every other HTML vhost on the box does. Without it (until 2026-10-25) the script
    # 404'd here and PromptPace sent no engagement events. Page views were still logged:
    # the weblog access_log is inherited from the http level.
    include /etc/nginx/weblog-endpoint.inc;

    # nginx serves static files directly; everything else goes to uvicorn.
    # The app links them as ?v=<content hash>, so a changed file gets a new URL and a
    # year-long cache is safe. index.html itself is sent with Cache-Control: no-cache.
    location /static/ {
        alias /opt/promptpace/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        limit_req zone=promptpace_api burst=20 nodelay;
        proxy_pass http://promptpace;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://promptpace;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # While uvicorn is starting (the lifespan runs the migrations and loads the SymSpell
    # dictionary, ~3-9 s after every restart) the socket refuses connections and nginx
    # answers 502. Without this, visitors got nginx's bare error page; this serves the
    # box's shared "temporarily unavailable" page instead, as every other vhost does.
    # The status stays 502/503/504, so the API's fetch() calls still see a failure.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
        # An add_header here replaces the server-level set, so the security headers are
        # repeated. The CSP differs on purpose: the page carries its own inline <style>
        # (it must not depend on anything while the app is down), which the site CSP's
        # style-src 'self' would block. no-store so an outage page is never kept.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    }
}
