# nginx site for PromptPace.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/promptpace
#          sudo ln -s /etc/nginx/sites-available/promptpace /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS with:  sudo certbot --nginx -d typing.example.com

# Goes in the http {} context (sites-enabled files are included there).
limit_req_zone $binary_remote_addr zone=promptpace_api:10m rate=10r/s;

upstream promptpace {
    server unix:/run/promptpace/uvicorn.sock;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name typing.example.com;   # <- change me

    # Keystroke logs are small; 2 MB is generous.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # nginx serves static files directly; everything else goes to uvicorn.
    location /static/ {
        alias /opt/promptpace/app/static/;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        limit_req zone=promptpace_api burst=20 nodelay;
        proxy_pass http://promptpace;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://promptpace;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
