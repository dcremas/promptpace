[project]
name = "promptpace"
version = "0.1.0"
description = "Measure how you type when writing prompts for an AI: overall WPM, burst speed, thinking pauses, and backspacing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.12",
    "symspellpy>=6.9",
    "uvicorn[standard]>=0.50",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=9",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# En dashes in user-facing labels are intentional.
ignore = ["RUF001"]
